spring.application.name=jp-capacitacao

spring.datasource.url=${URL_DB:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${USERNAME_DB:sys}
spring.datasource.password=${PASSWORD_DB:admin}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
